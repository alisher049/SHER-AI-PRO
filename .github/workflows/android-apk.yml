name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate serverless API syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in api/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Build web app
        run: npm run build
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Generate verified Blue AI launcher icons
        shell: bash
        run: |
          set -euo pipefail
          test -s public/image_868d9b2c.jpg || { echo "::error::Missing public/image_868d9b2c.jpg"; exit 1; }
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib, sys

          source = Path("public/image_868d9b2c.jpg")
          try:
              im = Image.open(source).convert("RGB")
          except Exception as exc:
              raise SystemExit(f"Blue AI source image is invalid: {exc}")
          if im.width < 128 or im.height < 128:
              raise SystemExit(f"Blue AI source image is unexpectedly small: {im.size}")
          # Keep the complete original artwork and its black background for
          # regular launcher icons; no stale custom-icons files are used.
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              out = Path("custom-icons") / folder
              out.mkdir(parents=True, exist_ok=True)
              icon = im.resize((size, size), Image.Resampling.LANCZOS).convert("RGB")
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  icon.save(out / name, format="PNG", optimize=True)
                  check = Image.open(out / name)
                  if check.size != (size, size):
                      raise SystemExit(f"Bad generated icon: {out/name}")
          # Adaptive foreground: transparent dark background so Android's
          # declared #050505 adaptive background shows through.
          rgba = im.convert("RGBA")
          px = rgba.load()
          for y in range(rgba.height):
              for x in range(rgba.width):
                  r, g, b, a = px[x, y]
                  level = max(r, g, b)
                  alpha = 0 if level <= 18 else (255 if level >= 58 else round((level-18)*255/40))
                  px[x, y] = (r, g, b, alpha)
          # Fit the artwork within Android's adaptive-icon safe zone.
          fg = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          art = rgba.resize((324, 324), Image.Resampling.LANCZOS)
          fg.alpha_composite(art, (54, 54))
          Path("android-icon-work").mkdir(exist_ok=True)
          fg.save("android-icon-work/ic_launcher_foreground.png", optimize=True)
          foreground_sizes = {"mipmap-mdpi":108,"mipmap-hdpi":162,"mipmap-xhdpi":216,"mipmap-xxhdpi":324,"mipmap-xxxhdpi":432}
          for folder, size in foreground_sizes.items():
              out = Path("custom-icons") / folder
              fg.resize((size,size), Image.Resampling.LANCZOS).save(out / "ic_launcher_foreground.png", optimize=True)
              if Image.open(out / "ic_launcher_foreground.png").size != (size,size):
                  raise SystemExit(f"Bad adaptive foreground density: {out}")
          print("Blue AI_SOURCE_SHA256=" + hashlib.sha256(source.read_bytes()).hexdigest())
          print("Generated and dimension-checked all 5 launcher densities from public/image_868d9b2c.jpg")
          PY
      - name: Add Capacitor Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure Android camera and microphone permissions
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -s "$MANIFEST"
          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          required = [
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-feature android:name="android.hardware.microphone" android:required="false" />',
              '    <uses-feature android:name="android.hardware.camera" android:required="false" />',
          ]
          for line in required:
              name = re.search(r'android:name="([^"]+)"', line).group(1)
              if not re.search(r'<(?:uses-permission|uses-feature)\b[^>]*android:name="' + re.escape(name) + r'"', source):
                  source = re.sub(r'(<application\b)', lambda m: line + '\n    ' + m.group(1), source, count=1)
          if not all(x in source for x in ['android.permission.RECORD_AUDIO','android.permission.MODIFY_AUDIO_SETTINGS','android.permission.CAMERA']):
              raise SystemExit("Manifest permission insertion failed")
          manifest.write_text(source, encoding="utf-8")

          java_files = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if len(java_files) != 1:
              raise SystemExit(f"Expected exactly one generated MainActivity.java, found {java_files}")
          java = java_files[0]
          old = java.read_text(encoding="utf-8")
          match = re.search(r'^\s*package\s+([\w.]+)\s*;', old, re.M)
          if not match:
              raise SystemExit("Could not determine generated Android application package")
          package = match.group(1)
          java.write_text(f'''package {package};

          import android.os.Bundle;
          import android.webkit.WebView;
          import android.view.WindowInsets;
          import android.graphics.Insets;
          import android.os.Build;

          import com.getcapacitor.BridgeActivity;

          /**
           * Camera and microphone WebView permissions.
           *
           * Capacitor 7 installs BridgeWebChromeClient on its WebView during Bridge
           * initialization. Its onPermissionRequest implementation requests Android
           * runtime CAMERA / RECORD_AUDIO / MODIFY_AUDIO_SETTINGS permissions and
           * grants or denies the originating WebView PermissionRequest accordingly.
           * Keep that managed WebChromeClient intact (do not replace it with a plain
           * WebChromeClient, which would also break Capacitor file chooser handling).
           */
          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  if (getBridge() != null && getBridge().getWebView() != null) {{
                      WebView webView = getBridge().getWebView();
                      webView.getSettings().setJavaScriptEnabled(true);
                      webView.setFitsSystemWindows(true);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          webView.setOnApplyWindowInsetsListener((view, insets) -> {{
                              Insets bars = insets.getInsets(WindowInsets.Type.systemBars() | WindowInsets.Type.displayCutout());
                              view.setPadding(bars.left, bars.top, bars.right, bars.bottom);
                              return insets;
                          }});
                      }
                      // BridgeWebChromeClient remains attached and owns onPermissionRequest.
                  }}
              }}

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {{
                  // Forward Android runtime permission results to Capacitor's
                  // ActivityResult / plugin permission machinery.
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
              }}
          }}
          ''', encoding="utf-8")
          print("Manifest camera/microphone permissions and Capacitor MainActivity runtime-permission forwarding configured.")
          PY
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' "$MANIFEST"
          grep -q 'android.permission.CAMERA' "$MANIFEST"
          grep -q 'onRequestPermissionsResult' "$(find android/app/src/main/java -name MainActivity.java -print -quit)"
      - name: Apply Blue AI icons and adaptive resources
        shell: bash
        run: |
          set -euo pipefail
          RES="android/app/src/main/res"
          mkdir -p "$RES/drawable" "$RES/values" "$RES/mipmap-anydpi-v26"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$density"
            for icon in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              test -s "custom-icons/mipmap-$density/$icon"
              install -m 0644 "custom-icons/mipmap-$density/$icon" "$RES/mipmap-$density/$icon"
            done
          done
          install -m 0644 android-icon-work/ic_launcher_foreground.png "$RES/drawable/ic_launcher_foreground.png"
          cat > "$RES/values/ic_launcher_background.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#05070B</color>
          </resources>
          EOF
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml")
          source=p.read_text(encoding="utf-8")
          m=re.search(r"<application\b[^>]*>",source)
          if not m: raise SystemExit("Android application element missing")
          tag=m.group(0)
          for attr,value in [("android:icon","@mipmap/ic_launcher"),("android:roundIcon","@mipmap/ic_launcher_round")]:
              tag=re.sub(r"\s+"+re.escape(attr)+r"=\"[^\"]*\"","",tag)
              tag=tag[:-1]+" "+attr+'="'+value+'">'
          p.write_text(source[:m.start()]+tag+source[m.end():],encoding="utf-8")
          PY
          grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$MANIFEST"
          echo "Applied and explicitly selected Blue AI regular, round and adaptive launcher resources."
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify packaged camera and microphone permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump permissions "$APK" | tee /tmp/sher-apk-permissions.txt
          grep -q 'android.permission.RECORD_AUDIO' /tmp/sher-apk-permissions.txt
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' /tmp/sher-apk-permissions.txt
          grep -q 'android.permission.CAMERA' /tmp/sher-apk-permissions.txt
          python - <<'PY'
          from zipfile import ZipFile
          apk = "android/app/build/outputs/apk/debug/app-debug.apk"
          with ZipFile(apk) as z:
              dex = b"".join(z.read(n) for n in z.namelist() if n.startswith("classes") and n.endswith(".dex"))
          required = [b"onPermissionRequest", b"AUDIO_CAPTURE", b"VIDEO_CAPTURE", b"RECORD_AUDIO", b"MODIFY_AUDIO_SETTINGS", b"CAMERA"]
          missing = [x.decode() for x in required if x not in dex]
          if missing:
              raise SystemExit("APK WebView permission handler verification failed; missing DEX strings: " + ", ".join(missing))
          print("ANDROID_WEBVIEW_PERMISSION_VERIFICATION=PASS")
          print("Verified packaged manifest permissions and Capacitor WebChromeClient audio/video runtime permission handler in DEX.")
          PY
      - name: Verify Blue AI artwork inside APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          python - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path
          from zipfile import ZipFile
          import io, sys

          apk = Path("android/app/build/outputs/apk/debug/app-debug.apk")
          expected_sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          with ZipFile(apk) as z:
              names = z.namelist()
              for density, size in expected_sizes.items():
                  for suffix in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                      candidates = [n for n in names if n.endswith("/" + suffix) and ("mipmap-" + density) in n]
                      if not candidates:
                          raise SystemExit(f"APK verification FAILED: missing {density}/{suffix}")
                      packaged = Image.open(io.BytesIO(z.read(candidates[0]))).convert("RGBA")
                      generated = Image.open(f"custom-icons/mipmap-{density}/{suffix}").convert("RGBA")
                      expected_size = size if suffix != "ic_launcher_foreground.png" else size * 108 // 48
                      if packaged.size != (expected_size, expected_size) or ImageChops.difference(packaged, generated).getbbox() is not None:
                          raise SystemExit(f"APK verification FAILED: {candidates[0]} does not match Blue AI source")
              fg_candidates = [n for n in names if n.endswith("/drawable/ic_launcher_foreground.png")]
              if not fg_candidates:
                  raise SystemExit("APK verification FAILED: adaptive foreground missing")
              packaged_fg = Image.open(io.BytesIO(z.read(fg_candidates[0]))).convert("RGBA")
              expected_fg = Image.open("android-icon-work/ic_launcher_foreground.png").convert("RGBA")
              if packaged_fg.size != expected_fg.size or ImageChops.difference(packaged_fg, expected_fg).getbbox() is not None:
                  raise SystemExit("APK verification FAILED: adaptive foreground is not the generated Blue AI artwork")
              # Compiled adaptive XML resources must be present in the APK.
              adaptive = [n for n in names if "mipmap-anydpi-v26" in n and n.endswith(".xml")]
              if len(adaptive) < 2:
                  raise SystemExit(f"APK verification FAILED: both adaptive XML resources missing; found {adaptive}")
          print("APK_VERIFICATION=PASS")
          print("Verified regular, round and adaptive foreground icons in all five density folders against Blue AI artwork.")
          PY
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sher-ai-pro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
