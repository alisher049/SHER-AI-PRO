services:
  - type: web
    name: sher-ai-story-render
    runtime: docker
    plan: free
    dockerfilePath: ./render_server/Dockerfile
    dockerContext: ./render_server
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_TEXT_CHARS
        value: "40000"
      - key: MAX_SCENES
        value: "60"
